[project]
name = "ui-fraud-coordination-agent"
version = "0.1.0"
description = "A Gemini-powered agent that detects multi-state unemployment insurance fraud by reading legacy mainframe and modern data sources through a privacy-preserving adapter pattern."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-otel>=0.13.0",
    "faker>=40.21.0",
    "google-genai>=2.8.0",
    "openinference-instrumentation-google-genai>=1.0.2",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
