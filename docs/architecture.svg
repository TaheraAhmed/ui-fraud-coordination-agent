<svg width="680" height="568" viewBox="0 0 680 568" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>UI fraud coordination agent architecture</title>
  <desc>Two heterogeneous state data sources are each read and hash-transformed by a per-state adapter, so raw PII never leaves the state boundary. A Gemini agent queries the federation on hashes only. Quasi-identifiers are released only through an audited gate when a cross-state match is found, producing structured findings, a due-process narrative, and an audit log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="568" fill="#ffffff"/>

  <text x="40" y="30" font-size="14" font-weight="500" fill="#2C2C2A">Data sources</text>

  <rect x="40" y="42" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="175" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">State AA — legacy mainframe</text>
  <text x="175" y="84" font-size="12" fill="#5F5E5A" text-anchor="middle">EBCDIC fixed-width, COBOL layout</text>

  <rect x="330" y="42" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="465" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">State BB — modern store</text>
  <text x="465" y="84" font-size="12" fill="#5F5E5A" text-anchor="middle">MongoDB document store</text>

  <line x1="175" y1="98" x2="175" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="465" y1="98" x2="465" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="128" width="270" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="175" y="152" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Adapter (State AA)</text>
  <text x="175" y="170" font-size="12" fill="#0F6E56" text-anchor="middle">Normalize to uniform schema,</text>
  <text x="175" y="186" font-size="12" fill="#0F6E56" text-anchor="middle">then HMAC-SHA256 identifiers</text>

  <rect x="330" y="128" width="270" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="465" y="152" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle">Adapter (State BB)</text>
  <text x="465" y="170" font-size="12" fill="#0F6E56" text-anchor="middle">Normalize to uniform schema,</text>
  <text x="465" y="186" font-size="12" fill="#0F6E56" text-anchor="middle">then HMAC-SHA256 identifiers</text>

  <line x1="175" y1="200" x2="290" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="465" y1="200" x2="390" y2="234" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="222" font-size="12" fill="#5F5E5A" text-anchor="middle">hash-transformed records only</text>

  <rect x="150" y="236" width="380" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="260" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle">Gemini agent — federation query</text>
  <text x="340" y="278" font-size="12" fill="#185FA5" text-anchor="middle">Matches on hashes only, no raw PII</text>

  <line x1="340" y1="292" x2="340" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="314" font-size="12" fill="#5F5E5A">cross-state match found</text>

  <rect x="150" y="322" width="380" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="346" font-size="14" font-weight="500" fill="#412402" text-anchor="middle">Audited quasi-identifier gate</text>
  <text x="340" y="364" font-size="12" fill="#854F0B" text-anchor="middle">Name, DOB, address — logged on release</text>

  <line x1="250" y1="378" x2="205" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="378" x2="340" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="378" x2="475" y2="448" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="450" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="130" y="474" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Structured findings</text>
  <text x="130" y="492" font-size="12" fill="#534AB7" text-anchor="middle">Machine-readable JSON</text>

  <rect x="250" y="450" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="474" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Due-process narrative</text>
  <text x="340" y="492" font-size="12" fill="#534AB7" text-anchor="middle">Human-readable</text>

  <rect x="460" y="450" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="550" y="474" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle">Audit log</text>
  <text x="550" y="492" font-size="12" fill="#534AB7" text-anchor="middle">Per-event content hash</text>
</svg>